[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-rollup-cli"
version = "0.1.0"
description = "WorkBuddy / CodeBuddy eval harness 与收入确认 skill 的本地开发仓库。"
readme = "AGENTS.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.8,<3.0",
    "requests>=2.32,<3.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[project.scripts]
run_skill_eval_batch = "cli.run_skill_eval_batch:main"

[tool.setuptools]
package-dir = {"" = "eval-harness"}

[tool.setuptools.packages.find]
where = ["eval-harness"]
